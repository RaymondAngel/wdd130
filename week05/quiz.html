<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>HTML and CSS Quiz</h1>
    </header>
    <main>
        <form>
            <label for="Q1">1. What does HTML stand for?</label>
            <input type="text" id="Q1" name="Q1" required>

            <label for="Q2">2. Why is it important to use semantic HTML?</label>
            <textarea id="Q2" name="Q2" rows="4" required></textarea>

            <label for="Q3">3. Which CSS property changes the text color?</label>
            <select id="Q3" name="Q3" required>
                <option value="">Choose one</option>
                <option value="color">color</option>
                <option value="background-color">background-color</option>
                <option value="font-size">font-size</option>
                <option value="margin">margin</option>
            </select>

            <label for="Q4">4. How many pixels are in 1rem when the root font size is 16px?</label>
            <input type="number" id="Q4" name="Q4" required>

            <button type="submit">Submit Quiz</button>
        </form>
    </main>
</body>
</html>
