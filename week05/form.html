<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css">
</head>
<body>
    <header>
        <h1>WDD 130 | HTML Form - User poll</h1>
    </header>
    <main>
        <form>
            <fieldset>
                <legend>Contact Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <br>
                <label for="email">Email:</label>
                <input type="email" id="email" name="useremail" required>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <label for="browser">What is your favorite browser?</label>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <br>
                <label for="pet">Do you have a household pet?</label>
                <input type="checkbox" id="pet" name="pet">

                <br>
                <label for="feedback">List the places you have lived.</label>
                <textarea id="feedback" name="feedback" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu Mali"></textarea>
            </fieldset>

            <div class="submit-button">
                <button type="submit">Submit poll</button>
            </div>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 | HTML Form - User poll activity | Raymond Amande </p>
    </footer>
</body>
</html>
