<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Contact Us | White Water Rafting California</title>
	<meta name="description" content="Exciting white water rafting company offering guided trips and safety-focused adventures on California's best rivers.">
	<meta name="author" content="Raymond Amande">
	<link rel="stylesheet" href="styles/rafting.css">
</head>
<body>

	<header>
		<img class="company-logo" src="./wwr.png" alt="White Water Rafting California logo">
		<nav aria-label="Main navigation">
			<a href="index.html">Home</a>
			<a href="about.html">About Us</a>
			<a href="trips.html">Trips</a>
			<a href="contact.html">Contact Us</a>
		</nav>
	</header>

	<main class="contact-page">
		<h1>Contact Us</h1>

		<section class="contact-info">
			<h2>Send Us a Message</h2>
			<p><strong>White Water Rafting</strong></p>
			<p>Address: 123 River Road, Idaho Falls, ID 83401</p>
			<p>Phone: (555) 123-4567</p>
			<p>Email: info@whitewater.com</p>
			<div class="map">
				<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d5757.989886064081!2d-111.783255!3d43.81446429999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x53540b03dc48a5cf%3A0x1e5534d3c38ef412!2sBrigham%20Young%20University-Idaho!5e0!3m2!1sen!2sus!4v1781259807131!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
			</div>
		</section>

		<section class="team">
			<h2>Meet the Team</h2>
			<div class="team-profiles">
				<figure>
					<img src="images/team_president.jpg" alt="Portrait of the company president" loading="lazy" decoding="async">
					<figcaption>President</figcaption>
				</figure>
				<figure>
					<img src="images/team_vice_president.jpg" alt="Portrait of the company vice president" loading="lazy" decoding="async">
					<figcaption>Vice President</figcaption>
				</figure>
				<figure>
					<img src="images/team_senior_manager.jpg" alt="Portrait of the company senior manager" loading="lazy" decoding="async">
					<figcaption>Senior Manager</figcaption>
				</figure>
			</div>
		</section>

		<section class="contact-form">
			<h2>Contact Us</h2>
			<form>
				<label for="fullname">Full Name</label>
				<input type="text" id="fullname" name="fullname" required>

				<label for="email">Email Address</label>
				<input type="email" id="email" name="email" required>

				<label for="message-purpose">Purpose of the Message</label>
				<select id="message-purpose" name="message-purpose" required>
					<option value="">Choose one</option>
					<option value="general-inquiry">General Inquiry</option>
					<option value="reservation-question">Reservation Question</option>
					<option value="website-question">Website Question</option>
				</select>

				<fieldset>
					<legend>Preferred Contact Method</legend>

					<input type="radio" id="contact-email" name="contact-method" value="email" required>
					<label for="contact-email">Email</label>

					<input type="radio" id="contact-phone" name="contact-method" value="phone">
					<label for="contact-phone">Phone</label>

					<input type="radio" id="contact-text" name="contact-method" value="text">
					<label for="contact-text">Text Message</label>
				</fieldset>

				<label for="message">Message</label>
				<textarea id="message" name="message" rows="4" required></textarea>

				<div class="newsletter">
					<input type="checkbox" id="newsletter" name="newsletter">
					<label for="newsletter">Please subscribe me to the monthly newsletter</label>
				</div>

				<button type="submit">Send Message</button>
			</form>
		</section>
	</main>

		
	<footer>
		<p>&copy; 2026 White Water Rafting California - Raymond Amande</p>
		<nav class="socialmedia" aria-label="Social media links">
			<a href="https://facebook.com" target="_blank" rel="noopener noreferrer"><img src="styles/facebook.svg" alt="Facebook"></a>
			<a href="https://twitter.com" target="_blank" rel="noopener noreferrer"><img src="styles/twitter.svg" alt="Twitter"></a>
			<a href="https://instagram.com" target="_blank" rel="noopener noreferrer"><img src="styles/instagram.svg" alt="Instagram"></a>
		</nav>
	</footer>

</body>
</html>
