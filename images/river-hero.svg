<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8fd3f4"/>
      <stop offset="100%" stop-color="#70a1d7"/>
    </linearGradient>
    <linearGradient id="river" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2da6d6"/>
      <stop offset="100%" stop-color="#1b6f93"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#sky)"/>
  <!-- mountains -->
  <g fill="#6b8aa1">
    <polygon points="0,300 180,140 360,300"/>
    <polygon points="240,300 420,120 600,300"/>
    <polygon points="480,300 700,100 920,300"/>
    <polygon points="840,300 1060,130 1280,300"/>
    <polygon points="1200,300 1400,160 1600,300"/>
  </g>
  <!-- river -->
  <path d="M0,300 C200,260 400,320 600,300 C800,280 1000,340 1200,300 C1400,260 1600,320 1800,300 L1800,400 L0,400 Z" fill="url(#river)" opacity="0.95"/>
  <!-- raft silhouette -->
  <g transform="translate(820,285) scale(0.9)" fill="#2b2b2b">
    <ellipse cx="0" cy="8" rx="30" ry="8"/>
    <rect x="-24" y="-10" width="48" height="12" rx="2"/>
    <circle cx="-6" cy="-6" r="4" fill="#ffd27f"/>
    <circle cx="8" cy="-6" r="4" fill="#ffd27f"/>
  </g>
  <text x="60" y="60" font-family="sans-serif" font-size="32" fill="#ffffff" opacity="0.9">White Water Rafting California</text>
</svg>
